[system]
name = "java-tron-security-review"
cli_package = "@openai/codex-security@0.1.20"
default_target = "../java-tron"
output_root = "var/scans"
default_auth = "auto"
advisory = true

knowledge_bases = [
  "knowledge/threat-model.md",
  "knowledge/tvm-review-playbook.md",
]

optional_knowledge_bases = [
  "../java-tron-kb/meta/audit-perspective.md",
  "../java-tron-kb/invariants",
]

scan_prompt = "prompts/scan.md"
validation_prompt = "prompts/validation.md"
