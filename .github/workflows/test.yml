name: Test security control plane

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install control plane
        run: python3 -m pip install --no-deps -e .

      - name: Compile Python sources
        run: python3 -m py_compile src/tron_security_review/*.py

      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v

      - name: Audit pinned production dependencies
        run: python3 scripts/check_npm_audit.py
